name: Android CI and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android toolchain
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.1.12297006 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Build and lint
        env:
          WP09_MAVEN_CENTRAL_URL: https://maven-central.storage-download.googleapis.com/maven2/
        run: ./gradlew --no-daemon :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
      - name: Upload debug APK
        if: ${{ github.ref_type != 'tag' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: WP-09-debug-arm64
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload unsigned release for signing
        if: ${{ github.ref_type == 'tag' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
    steps:
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install signing tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'build-tools;35.0.0'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: unsigned-release
          path: staging
      - name: Check the version and sign the APK
        env:
          WP09_SIGNING_KEYSTORE: ${{ secrets.WP09_SIGNING_KEYSTORE }}
          WP09_SIGNING_PASSWORD: ${{ secrets.WP09_SIGNING_PASSWORD }}
        run: |
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          apk_version=$("$build_tools/aapt2" dump badging staging/app-release-unsigned.apk |
            sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+(\.[0-9]+){1,2}$ || "$GITHUB_REF_NAME" != "v$apk_version" ]]; then
            echo "::error::The release tag must match the APK version, expected v$apk_version"
            exit 1
          fi
          : "${WP09_SIGNING_KEYSTORE:?Missing WP09_SIGNING_KEYSTORE secret}"
          : "${WP09_SIGNING_PASSWORD:?Missing WP09_SIGNING_PASSWORD secret}"
          umask 077
          key_file=$(mktemp "$RUNNER_TEMP/wp09-signing.XXXXXXXX.p12")
          trap 'rm -f -- "$key_file"' EXIT
          printf '%s' "$WP09_SIGNING_KEYSTORE" | base64 --decode > "$key_file"
          mkdir -p dist
          "$build_tools/zipalign" -P 16 -f 4 staging/app-release-unsigned.apk staging/aligned.apk
          artifact="WP-09-$GITHUB_REF_NAME-arm64.apk"
          "$build_tools/apksigner" sign --ks "$key_file" --ks-type PKCS12 --ks-key-alias wp09 \
            --ks-pass env:WP09_SIGNING_PASSWORD --out "dist/$artifact" staging/aligned.apk
          "$build_tools/apksigner" verify "dist/$artifact"
          cd dist
          sha256sum "$artifact" > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          artifact="dist/WP-09-$GITHUB_REF_NAME-arm64.apk"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$artifact" dist/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$artifact" dist/SHA256SUMS.txt \
              --verify-tag --generate-notes --title "WP-09 $GITHUB_REF_NAME"
          fi
